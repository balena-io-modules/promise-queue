- commits:
    - subject: Add a test suite
      hash: abf7264715289aa2fe8ac9151572753b063a5b63
      body: >
        Tests run with node's native type stripping (`node --test`, node >=
        22.18,

        which all node versions flowzone currently tests on satisfy) and chai.


        Typing tests are plain files in test/types/ that are type-checked by

        `tsc -p tsconfig.test.json` (use `@ts-expect-error` for usages that must
        not

        compile, and `Expect<Equal<A, B>>` for exact types). They import the

        declarations emitted into out/ rather than the sources, since some
        typing

        issues only show up in the published `.d.ts`, so `lint` builds first.


        @types/node is updated to v22 for the `node:test` types; the published

        declarations do not reference any node types.
      footer:
        Change-type: patch
        change-type: patch
      author: Pagan Gazzard
